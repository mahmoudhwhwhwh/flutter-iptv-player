name: flutter_iptv_player
description: "A modern IPTV Stream Player supporting M3U, Xtream Codes, and ExoPlayer playback on Android systems."
version: 2.2.2+303
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
    
  provider: ^6.1.2
  cached_network_image: ^3.3.1
  
  # Network & API Connections
  http: ^1.2.1
  
  # BetterPlayer uses video_player internally for platform playback.
  video_player: ^2.8.2
  better_player_plus: ^1.0.7
  
  # Client side database persistence for favorites/playlists
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  sensors_plus: ^5.0.1
  package_info_plus: 8.0.0
  
  # URL Launching for Telegram Connection
  url_launcher: ^6.2.5
  dio: ^5.4.3+1
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  image_picker: ^1.1.2

  
  # UI Accents & Icons
  
  # Firebase Analytics & Monitoring
  firebase_core: ^2.31.0
  firebase_analytics: ^10.10.4
  webview_flutter: ^4.10.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/intro_premium.mp4
    - assets/loading_screen.png
    - assets/live_stream_pro_logo.png
    - assets/loading_stream.mp4
    - assets/channel_offline.mp4
