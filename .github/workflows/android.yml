name: Build Android APK
on:
  workflow_dispatch: # Manual only as requested

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          # Build a release APK (now patched to use debug signing if needed)
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk LIVE_STREAM_PREMIUM_V2.2.15.apk

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.15-final
          name: LIVE STREAM PREMIUM v2.2.15 (Stable)
          body: |
            🚀 النسخة النهائية v2.2.15.
            ✅ تم حل مشكلة فشل البناء نهائياً.
            ✅ تحديث تلقائي من GitHub للسلايدر والمنيو.
            ✅ نظام تسجيل دخول آمن ومشفر.
          files: LIVE_STREAM_PREMIUM_V2.2.15.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
