name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2548m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC"
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/LiveStreamPro.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/LIVE_STREAM_PRO.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/live_strem_pro.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "live strem pro - Latest Build 🚀"
          body: "This release is updated automatically with the latest codes, D-Pad focus adjustments, TV box improvements, and fixes.\n\nAlways download the latest build from the direct link."
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/LiveStreamPro.apk
            build/app/outputs/flutter-apk/LIVE_STREAM_PRO.apk
            build/app/outputs/flutter-apk/live_strem_pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
