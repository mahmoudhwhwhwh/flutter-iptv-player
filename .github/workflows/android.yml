name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Install dependencies
        run: |
          flutter pub get
          # Backup our manual registrant
          cp android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java GeneratedPluginRegistrant.java.bak
      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          TAG_VERSION="v$(echo $VERSION | cut -d '+' -f 1)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION (Tag: $TAG_VERSION)"
      - name: Clean build
        run: |
          flutter clean
          # Restore our manual registrant after clean
          mkdir -p android/app/src/main/java/io/flutter/plugins/
          cp GeneratedPluginRegistrant.java.bak android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
      - name: Build Android APK
        run: |
          # 1. Run pub get to ensure all plugins are downloaded
          flutter pub get
          # 2. Try a clean build to generate the registrant
          flutter build apk --debug || true
          # 3. Patch the registrant to fix missing imports and classes
          # We use a robust way to find and patch it
          REGISTRANT_PATH=$(find . -name GeneratedPluginRegistrant.java | head -n 1)
          if [ -n "$REGISTRANT_PATH" ]; then
            echo "Patching $REGISTRANT_PATH"
            sed -i 's/import io.flutter.Log;/import android.util.Log;/g' "$REGISTRANT_PATH"
            # Ensure android.util.Log is imported if not present
            grep -q "import android.util.Log;" "$REGISTRANT_PATH" || sed -i '2i import android.util.Log;' "$REGISTRANT_PATH"
          fi
          # 4. Final build attempt
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk LIVE_STREAM_PREMIUM.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIVE_STREAM_PREMIUM_v2.2.34
          path: LIVE_STREAM_PREMIUM.apk
