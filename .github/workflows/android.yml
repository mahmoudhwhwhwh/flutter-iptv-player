name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/LIVE_STREAM_PREMIUM.apk

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: LIVE STREAM PREMIUM - v2.2.15 (Final)
          body: |
            ✅ النسخة v2.2.15 جاهزة للعمل.
            ✅ تم تأمين كافة السيرفرات عبر Cloudflare.
            ✅ الأكواد تضاف تلقائياً في الموقع.
          draft: false
          prerelease: false
          make_latest: true
          files: build/app/outputs/flutter-apk/LIVE_STREAM_PREMIUM.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
