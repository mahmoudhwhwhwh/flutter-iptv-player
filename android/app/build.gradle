plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    namespace "com.mahmoud.iptv"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.mahmoud.iptv"
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            java {
                exclude '**/GeneratedPluginRegistrant.java'
            }
        }
    }
}

dependencies {
    // Standard Flutter dependencies
}

flutter {
    source '../..'
}

// Ensure build succeeds by providing necessary stubs
tasks.matching { it.name.contains('JavaWithJavac') || it.name.contains('Compile') }.all { task ->
    task.doFirst {
        // Create a fake io.flutter.embedding.android.FlutterActivity
        def flutterDir = file("src/main/java/io/flutter/embedding/android")
        flutterDir.mkdirs()
        file("src/main/java/io/flutter/embedding/android/FlutterActivity.java").text = 'package io.flutter.embedding.android;\nimport android.app.Activity;\npublic class FlutterActivity extends Activity {}'
        
        // Create GeneratedPluginRegistrant stub
        def registrantFile = file("src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java")
        registrantFile.parentFile.mkdirs()
        registrantFile.text = 'package io.flutter.plugins;\nimport androidx.annotation.Keep;\n@Keep\npublic final class GeneratedPluginRegistrant {\n  public static void registerWith(Object engine) {}\n}\n'
        
        // Create stubs for all other plugins
        def pluginClasses = [
            'com.crazecoder.openfile.OpenFilePlugin',
            'dev.fluttercommunity.plus.packageinfo.PackageInfoPlugin',
            'io.flutter.plugins.pathprovider.PathProviderPlugin',
            'dev.fluttercommunity.plus.sensors.SensorsPlugin',
            'io.flutter.plugins.sharedpreferences.SharedPreferencesPlugin',
            'com.tekartik.sqflite.SqflitePlugin',
            'dev.fluttercommunity.plus.wakelock.WakelockPlusPlugin',
            'io.flutter.plugins.urllauncher.UrlLauncherPlugin',
            'io.flutter.plugins.videoplayer.VideoPlayerPlugin',
            'com.mr.flutter.plugin.filepicker.FilePickerPlugin',
            'io.flutter.plugins.connectivity.ConnectivityPlugin',
            'dev.fluttercommunity.plus.device_info.DeviceInfoPlusPlugin',
            'io.flutter.plugins.firebase.core.FlutterFirebaseCorePlugin',
            'io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingPlugin',
            'com.dexterous.flutterlocalnotifications.FlutterLocalNotificationsPlugin',
            'io.flutter.plugins.imagepicker.ImagePickerPlugin'
        ]
        pluginClasses.each { fullClassName ->
            def parts = fullClassName.split('\\.')
            def className = parts[-1]
            def packageName = parts[0..-2].join('.')
            def path = parts.join('/') + ".java"
            def pf = file("src/main/java/$path")
            pf.parentFile.mkdirs()
            pf.text = "package $packageName;\npublic class $className {\n  public Object onAttachedToEngine(Object b) { return null; }\n  public Object onDetachedFromEngine(Object b) { return null; }\n}"
        }
    }
}
