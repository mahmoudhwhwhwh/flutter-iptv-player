name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/bundle/release/debug-info
          find build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} LIVE_STREAM_PREMIUM_V2.2.27.apk \;
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIVE_STREAM_PREMIUM_V2.2.27
          path: LIVE_STREAM_PREMIUM_V2.2.27.apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.27-stable
          name: LIVE STREAM PREMIUM v2.2.27
          body: "النسخة العالمية النهائية والمحدثة (v2.2.27). تم حل مشكلة اختفاء القنوات والأفلام والمسلسلات، وتفعيل حماية ProGuard والتشفير الكامل، ودعم وضع PiP، وإعلانات AdMob المدارة عن بُعد."
          files: LIVE_STREAM_PREMIUM_V2.2.27.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
