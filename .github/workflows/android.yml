name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Install dependencies
        run: |
          flutter pub get
          # Backup our manual registrant
          cp android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java GeneratedPluginRegistrant.java.bak
      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          TAG_VERSION="v$(echo $VERSION | cut -d '+' -f 1)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION (Tag: $TAG_VERSION)"
      - name: Fresh Start Android
        run: |
          # Backup essential files
          mkdir -p backup
          cp android/app/google-services.json backup/ || true
          cp -r android/app/src/main/res/drawable* backup/ || true
          
          # Delete and recreate android folder
          rm -rf android
          flutter create . --project-name flutter_iptv_player --platforms android --org com.mahmoud.iptv
          
          # Restore essential files
          cp backup/google-services.json android/app/ || true
          cp -r backup/drawable* android/app/src/main/res/ || true
          
          # Patch Kotlin version in settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          
          # Overwrite MainActivity with correct v2 embedding code and screen recording fix
          MAIN_ACTIVITY=$(find android/app/src/main -name MainActivity.*)
          echo "Overwriting $MAIN_ACTIVITY"
          PACKAGE_NAME=$(grep "package " "$MAIN_ACTIVITY" | head -n 1)
          cat <<EOF > "$MAIN_ACTIVITY"
$PACKAGE_NAME

import android.os.Bundle
import android.view.WindowManager
import io.flutter.embedding.android.FlutterActivity

class MainActivity: FlutterActivity() {
    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
    }
}
EOF
      - name: Build Android APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk LIVE_STREAM_PREMIUM.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIVE_STREAM_PREMIUM_v2.2.34
          path: LIVE_STREAM_PREMIUM.apk
