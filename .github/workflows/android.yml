name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Install dependencies
        run: |
          flutter pub get
          # Backup our manual registrant
          cp android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java GeneratedPluginRegistrant.java.bak
      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          TAG_VERSION="v$(echo $VERSION | cut -d '+' -f 1)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          echo "Building version $VERSION (Tag: $TAG_VERSION)"
      - name: Fresh Start Android
        run: |
          # Backup essential files
          mkdir -p backup
          cp android/app/google-services.json backup/ || true
          cp -r android/app/src/main/res/drawable* backup/ || true
          
          # Delete and recreate android folder
          rm -rf android
          flutter create . --platforms android --org com.mahmoud.iptv
          
          # Restore essential files
          cp backup/google-services.json android/app/ || true
          cp -r backup/drawable* android/app/src/main/res/ || true
          
          # Patch MainActivity to allow screen recording
          # Find the MainActivity (could be .kt or .java)
          MAIN_ACTIVITY=$(find android/app/src/main -name MainActivity.*)
          echo "Patching $MAIN_ACTIVITY"
          if [[ "$MAIN_ACTIVITY" == *.kt ]]; then
            sed -i '/import io.flutter.embedding.android.FlutterActivity/a import android.os.Bundle\nimport android.view.WindowManager' "$MAIN_ACTIVITY"
            sed -i '/class MainActivity/a \    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)\n    }' "$MAIN_ACTIVITY"
          else
            sed -i '/import io.flutter.embedding.android.FlutterActivity/a import android.os.Bundle;\nimport android.view.WindowManager;' "$MAIN_ACTIVITY"
            sed -i '/public class MainActivity/a \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SECURE);\n    }' "$MAIN_ACTIVITY"
          fi
      - name: Build Android APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk LIVE_STREAM_PREMIUM.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIVE_STREAM_PREMIUM_v2.2.34
          path: LIVE_STREAM_PREMIUM.apk
