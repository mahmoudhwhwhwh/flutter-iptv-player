name: Build Android Release APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: write

env:
  APK_NAME: LIVE_STREAM_PREMIUM.apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '\r')"
          VERSION_NAME="${VERSION%%+*}"
          VERSION_CODE="${VERSION##*+}"
          TAG_VERSION="v${VERSION_NAME}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "TAG_VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"
          echo "Building ${VERSION} (${TAG_VERSION})"

      - name: Build one production APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"

      - name: Prepare release APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

      - name: Verify release artifact
        run: |
          test -s "$APK_NAME"
          ls -lh "$APK_NAME"
          sha256sum "$APK_NAME"
          unzip -l "$APK_NAME" | sort -k1,1nr | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_VERSION }}
          name: Release ${{ env.TAG_VERSION }}
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
