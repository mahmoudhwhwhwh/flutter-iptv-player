plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.mahmoud.iptv"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.mahmoud.iptv"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 234
        versionName "2.2.34"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.annotation:annotation:1.7.0"
    
    // Manually adding core Flutter dependencies to ensure they are in classpath
    implementation "io.flutter:flutter_embedding_debug:1.0.0-e672b006451c588a4442750377e8040715367683"
}

apply plugin: 'com.google.gms.google-services'
