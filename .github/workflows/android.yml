name: Build Android APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --debug
          mv build/app/outputs/flutter-apk/app-debug.apk LIVE_STREAM_PREMIUM_V2.2.16.apk

      - name: Create GitHub Release
        run: |
          gh release delete v2.2.16-stable --yes || true
          gh release create v2.2.16-stable LIVE_STREAM_PREMIUM_V2.2.16.apk --title "LIVE STREAM PREMIUM v2.2.16" --notes "النسخة النهائية والمستقرة v2.2.16. تم حل كافة مشاكل البناء والرفع."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: LIVE_STREAM_PREMIUM_V2.2.16-APK
          path: LIVE_STREAM_PREMIUM_V2.2.16.apk
